services:
  rtsp-to-onvif:
    image: ghcr.io/antiheld889/rto:latest
    hostname: rtsp-to-onvif
    #restart: unless-stopped
    volumes:
      - ./config.yaml:/onvif.yaml
    network_mode: "host"   
    cap_add:
      - NET_ADMIN
    environment: # remove this once setup is complete to reduce log noise
      DEBUG: "1"